name: Lean 4 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify no sorry, admit, or custom axiom declarations
        run: |
          if grep -rnE '\b(sorry|admit|axiom)\b' DiscreteAlgebra.lean DiscreteAlgebra/; then
            echo "Error: Forbidden proof placeholder or custom axiom detected."
            exit 1
          fi

      - name: Build Lean 4 library
        run: lake build
        
